# Temporary: lists the Xcode versions on GitHub's Mac runners (watch branch only). Removed before merging.
name: Xcode probe
on:
  push:
    branches: [watch]
    paths: [".github/workflows/xcode-probe.yml"]
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix: { os: [macos-latest, macos-26, macos-26-xlarge, macos-15] }
    runs-on: ${{ matrix.os }}
    steps:
      - run: sw_vers; ls -d /Applications/Xcode* ; xcodebuild -version

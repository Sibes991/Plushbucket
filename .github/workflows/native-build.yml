# Builds test versions of the iPhone and Android apps on GitHub's machines, so no Mac is needed yet.
# Android: produces an installable debug APK (download it from the run's Artifacts).
# iPhone: compiles for the iOS Simulator to prove it builds. Real-device and App Store builds need
# an Apple Developer account and signing, added in a later step.
name: Native apps

on:
  workflow_dispatch:
  push:
    branches: [main, native-apps]
    paths: ["index.html", "icons/**", "native/**", ".github/workflows/native-build.yml"]

jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: native } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npm run build:web
      - name: Create the Android project if it isn't committed yet
        run: test -d android || npx cap add android
      - run: npm run icons -- --android
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: native/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: plushbucket-android-debug
          path: native/android/app/build/outputs/apk/debug/*.apk

  ios:
    runs-on: macos-latest
    defaults: { run: { working-directory: native } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run build:web
      - name: Create the iOS project if it isn't committed yet
        run: test -d ios || npx cap add ios
      - run: npm run icons -- --ios
      - run: npx cap sync ios
      - name: Build for the iOS Simulator (no signing)
        working-directory: native/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build

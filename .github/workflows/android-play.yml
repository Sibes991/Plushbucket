# Builds a signed Android App Bundle (.aab) for Google Play.
# Run it from Actions > "Android for Google Play" > Run workflow, then download the .aab
# from the run's Artifacts and upload it in Play Console (Testing > Closed testing > Create new release).
# Needs two repository secrets: ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASSWORD (key alias: upload).
name: Android for Google Play

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version name shown in the Play Store (e.g. 1.1)"
        required: true
        default: "1.1"

jobs:
  bundle:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: native } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npm run build:web
      - name: Create the Android project if it isn't committed yet
        run: test -d android || npx cap add android
      - run: npm run icons -- --android
      - run: npx cap sync android
      - name: Set the version (build number goes up by itself on every run)
        working-directory: native/android/app
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"${{ inputs.version }}\"/" build.gradle
          grep -E "versionCode|versionName" build.gradle
      - name: Build the release bundle
        working-directory: native/android
        run: ./gradlew bundleRelease
      - name: Sign it with the upload key
        working-directory: native/android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          AAB=app/build/outputs/bundle/release/app-release.aab
          jarsigner -keystore "$RUNNER_TEMP/upload.jks" -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -sigalg SHA256withRSA -digestalg SHA-256 "$AAB" upload
          jarsigner -verify "$AAB" | tail -1
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$AAB" "$GITHUB_WORKSPACE/out/plushbucket-${{ inputs.version }}-${{ github.run_number }}.aab"
          rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: plushbucket-android-bundle
          path: out/*.aab
          retention-days: 7

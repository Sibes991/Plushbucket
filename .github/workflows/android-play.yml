# Builds a signed Android App Bundle (.aab) for Google Play.
# Run it from Actions > "Android for Google Play" > Run workflow, then download the .aab
# from the run's Artifacts and upload it in Play Console (Testing > Closed testing > Create new release).
# Needs two repository secrets: ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASSWORD (key alias: upload).
name: Android for Google Play

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version name shown in the Play Store (e.g. 1.1)"
        required: true
        default: "1.1"

jobs:
  bundle:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: native } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npm run build:web
      - name: Create the Android project if it isn't committed yet
        run: test -d android || npx cap add android
      - name: Android 8.0 or newer (Health Connect's library, used for ride import, needs it)
        run: |
          sed -i -E 's/minSdkVersion = [0-9]+/minSdkVersion = 26/' android/variables.gradle
          grep -q "minSdkVersion = 26" android/variables.gradle
      - run: npm run icons -- --android
      - run: npx cap sync android
      - name: Set the version (build number goes up by itself on every run)
        working-directory: native/android/app
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"${{ inputs.version }}\"/" build.gradle
          grep -E "versionCode|versionName" build.gradle
      - name: Turn on R8 (shrinks and optimizes the release build)
        working-directory: native/android/app
        run: |
          perl -0pi -e 's/minifyEnabled\s+false/minifyEnabled true\n            shrinkResources true/' build.gradle
          perl -pi -e 's/proguard-android\.txt/proguard-android-optimize.txt/' build.gradle
          cat ../../android-proguard-rules.pro >> proguard-rules.pro
          grep -nE "minifyEnabled|shrinkResources|proguard" build.gradle
          # stop here if Capacitor's template changed and the edits above didn't apply
          grep -q "minifyEnabled true" build.gradle
          grep -q "proguard-android-optimize.txt" build.gradle
      - name: Build the release bundle
        working-directory: native/android
        run: ./gradlew bundleRelease
      - name: Sign it with the upload key
        working-directory: native/android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          AAB=app/build/outputs/bundle/release/app-release.aab
          jarsigner -keystore "$RUNNER_TEMP/upload.jks" -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -sigalg SHA256withRSA -digestalg SHA-256 "$AAB" upload
          jarsigner -verify "$AAB" | tail -1
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$AAB" "$GITHUB_WORKSPACE/out/plushbucket-${{ inputs.version }}-${{ github.run_number }}.aab"
          rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v6
        with:
          name: plushbucket-android-bundle
          path: out/*.aab
          retention-days: 7
      # R8's map from shortened names back to the real ones, for reading crash reports.
      # The .aab carries it too, so Play Console decodes crashes by itself.
      - uses: actions/upload-artifact@v6
        with:
          name: plushbucket-android-r8-mapping
          path: native/android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 30

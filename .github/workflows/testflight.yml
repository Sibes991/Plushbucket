# Builds the iPhone app, signs it with Apple, and uploads it to TestFlight.
# Run it from GitHub: Actions → "iPhone to TestFlight" → Run workflow.
# Needs these repository secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, APPLE_TEAM_ID.
name: iPhone to TestFlight

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version shown in the App Store, e.g. 1.0"
        required: true
        default: "1.0"
  # pushing to the "testflight" branch also starts it (works before the app is merged to main)
  push:
    branches: [testflight]

jobs:
  testflight:
    runs-on: macos-latest
    defaults: { run: { working-directory: native } }
    env:
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      # Xcode 26 or newer is needed for Apple's on-device AI (Foundation Models) used by Trail notes
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - run: xcodebuild -version
        working-directory: .
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Check the Apple secrets are set
        run: |
          missing=""
          for v in KEY_ID ISSUER_ID TEAM_ID; do [ -n "${!v}" ] || missing="$missing $v"; done
          [ -n "${{ secrets.ASC_KEY_P8 }}" ] || missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then echo "::error::Missing secrets:$missing"; exit 1; fi

      - run: npm install
      - run: npm run build:web
      - name: Create the iOS project if it isn't committed yet
        run: test -d ios || npx cap add ios
      - run: npm run icons -- --ios
      - run: npx cap sync ios

      - name: Save the App Store Connect key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "${{ secrets.ASC_KEY_P8 }}" > "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"

      - name: Mark the app as using only standard encryption (skips a TestFlight question)
        working-directory: native/ios/App/App
        run: /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" Info.plist || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" Info.plist

      - name: Build and sign
        working-directory: native/ios/App
        run: |
          xcodebuild archive -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            PRODUCT_BUNDLE_IDENTIFIER=com.plushbucket.app \
            MARKETING_VERSION="${{ inputs.version || '1.0' }}" CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
